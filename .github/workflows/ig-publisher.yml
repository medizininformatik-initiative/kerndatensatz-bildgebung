# This is a basic workflow to help you get started with Actions

name: Build and Publish IG

# Controls when the action will run.
on:
  push:
    branches:
      - '**'
      - '!gh-pages'
      - '!fsh-generated'
  pull_request:

permissions:
  actions: write
  contents: write
  id-token: write
  issues: write
  pages: write
  pull-requests: write

concurrency:
  group: ${{ github.event_name == 'push' && github.ref_name != 'main' && 'gh-pages-writes' || format('ig-readonly-{0}', github.run_id) }}
  queue: max

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Create NGINX config and certificates
        shell: bash
        env:
          CDS_DEV_CLIENT_CERT: ${{ secrets.CDS_DEV_CLIENT_CERT }}
          CDS_DEV_CLIENT_KEY: ${{ secrets.CDS_DEV_CLIENT_KEY }}
          CDS_DEV_CLIENT_CERT_PASSWORD: ${{ secrets.CDS_DEV_CLIENT_CERT_PASSWORD }}
        run: |
          mkdir -p nginx/certs

          # Download the NGINX config
          curl -sSL -o nginx/nginx.conf https://raw.githubusercontent.com/medizininformatik-initiative/kerndatensatz-meta/refs/heads/master/.github/workflows/nginx.conf

          # Decode and save the client certificate and key
          echo "$CDS_DEV_CLIENT_CERT" | base64 -d > nginx/certs/client-cert.pem
          echo "$CDS_DEV_CLIENT_KEY" | base64 -d > nginx/certs/client-key-encrypted.key

          # Decrypt the private key using OpenSSL
          openssl rsa -in nginx/certs/client-key-encrypted.key -out nginx/certs/client-key.key -passin env:CDS_DEV_CLIENT_CERT_PASSWORD

      - name: Start NGINX Proxy
        run: |
          docker run -d --name nginx-proxy \
            -v $PWD/nginx/nginx.conf:/etc/nginx/nginx.conf:ro \
            -v $PWD/nginx/certs:/etc/nginx/certs:ro \
            -p 8090:80 \
            nginx:alpine

          sleep 5

          for i in {1..10}; do
            if curl --head --silent --fail http://localhost:8090; then
              echo "NGINX is responding."
              break
            else
              echo "NGINX not responding. Attempt $i"
              sleep 2
              if [ $i -eq 10 ]; then
                echo "NGINX is still not responding after $i attempts."
                docker logs nginx-proxy
                exit 1
              fi
            fi
          done

      # Run SUSHI (FSH -> FHIR conversion)
      - name: Run SUSHI
        run: docker run --rm --network host -v $PWD:/workspace -v /usr/bin/dot:/usr/local/bin/dot:ro -v /usr/lib/x86_64-linux-gnu:/usr/host/lib:ro -e LD_LIBRARY_PATH=/usr/host/lib -w /workspace ghcr.io/gefyra/ig-publisher-with-snapshot-support:latest sushi .
      
      # Run the HL7 FHIR IG Publisher
      - name: Build IG
        run: |
          set -euo pipefail
          docker run --rm --network host -v $PWD:/workspace -v /usr/bin/dot:/usr/local/bin/dot:ro -v /usr/lib/x86_64-linux-gnu:/usr/host/lib:ro -e LD_LIBRARY_PATH=/usr/host/lib -w /workspace ghcr.io/gefyra/ig-publisher-with-snapshot-support:latest sh -c "igpublisher -ig ig.ini -tx http://127.0.0.1:8090/fhir"
          test -s output/index.html
          test -s output/qa.json
          jq empty output/qa.json
      
      - name: Cleanup NGINX
        if: always()
        run: |
          docker stop nginx-proxy || true
          docker rm nginx-proxy || true

      - name: Fix output directory permissions
        run: sudo chown -R $USER:$USER output

      - name: Restore localized table backgrounds
        shell: bash
        run: bash scripts/copy-localized-table-backgrounds.sh output

      - name: Point publication history links to GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          canonical="$(jq -er '.canonical' package.json)"
          repo_owner="${GITHUB_REPOSITORY_OWNER}"
          repo_name="${GITHUB_REPOSITORY#*/}"
          publication_base="https://${repo_owner}.github.io/${repo_name}"
          node scripts/fix-publication-history-links.mjs \
            --headers-only \
            output \
            "${canonical}" \
            "${publication_base}"

      - name: Record branch metadata for Pages cleanup
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref_name != 'main'
        run: |
          set -eu
          echo "${GITHUB_REF_NAME}" > "output/.branch-name"

      # Upload the IG build output as an artifact
      - name: Upload Build Results
        uses: actions/upload-artifact@v4
        with:
          name: fhir-ig
          path: |
            output

      # Publish the IG output to GitHub Pages
      - name: Publish to GitHub Pages
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref_name != 'main'
        shell: bash
        env:
          REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          PAGES_ACTIONS_ENABLED: ${{ vars.PAGES_ACTIONS_ENABLED }}
        run: |
          set -euo pipefail

          remote_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"

          rm -rf gh-pages

          if git ls-remote --heads "${remote_url}" gh-pages | grep -q "."; then
            git clone --depth 1 --branch gh-pages "${remote_url}" gh-pages
          else
            git clone "${remote_url}" gh-pages
            cd gh-pages
            git config user.name "${GIT_AUTHOR_NAME}"
            git config user.email "${GIT_AUTHOR_EMAIL}"
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
            touch .nojekyll
            git add .nojekyll
            git commit -m "chore: initialize gh-pages"
            git push --set-upstream origin gh-pages
            cd ..
          fi

          # The root and version-like paths are reserved for formal -go-publish
          # output. All CI previews live below a collision-free namespace.
          branch_dir="gh-pages/branches/${GITHUB_REF_NAME}"
          rm -rf "${branch_dir}"
          mkdir -p "${branch_dir}"
          cp -R "output/." "${branch_dir}/"
          echo "Published ${GITHUB_REF_NAME} to branches/${GITHUB_REF_NAME}/"

          cd gh-pages
          if [[ "${PAGES_ACTIONS_ENABLED}" == "true" ]]; then
            bytes="$(du --bytes --summarize --exclude=.git . | cut -f1)"
            supported_max_bytes="1000000000"
            if (( bytes > supported_max_bytes )); then
              echo "::warning::The staged Pages site is ${bytes} bytes, above GitHub Pages' ${supported_max_bytes}-byte officially supported maximum. Publication will continue, but Pages does not guarantee deployments above 1 GB."
            fi
          fi
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
          git add --all
          if git diff --cached --quiet; then
            echo "No updates to publish."
            exit 0
          fi
          git commit -m "chore: update ${GITHUB_REF_NAME} pages"
          git push origin gh-pages

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref_name != 'main' && vars.PAGES_ACTIONS_ENABLED == 'true'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref_name != 'main' && vars.PAGES_ACTIONS_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: gh-pages

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref_name != 'main' && vars.PAGES_ACTIONS_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      id-token: write
      pages: write
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

  # Report from a job that does not consume the terminology secrets used by the
  # build. This preserves literal repository URLs in summaries and PR comments.
  announce:
    name: Report preview deployment
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref_name != 'main' && vars.PAGES_ACTIONS_ENABLED == 'true'
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Announce published URL
        shell: bash
        run: |
          set -euo pipefail
          repo_owner="${GITHUB_REPOSITORY_OWNER}"
          repo_name="${GITHUB_REPOSITORY#*/}"
          branch="${GITHUB_REF_NAME}"
          url="https://${repo_owner}.github.io/${repo_name}/branches/${branch}/"

          echo "Published to ${url}"
          printf '### Deployment\n[Open published IG for branch `%s`](%s)\n' \
            "${branch}" \
            "${url}" \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Upsert PR comment with published URL
        id: preview_comment
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = process.env.BRANCH_NAME;
            const marker = '<!-- ig-publish-url -->';
            const url = `https://${owner}.github.io/${repo}/branches/${branch}/`;
            const body = `${marker}
            ### Deployment
            [Open published IG for branch \`${branch}\`](${url})`;

            // Try to find an open PR for this branch
            const { data: prs } = await github.rest.pulls.list({
              owner, repo, state: 'open', per_page: 100
            });
            const pr = prs.find(p => p.head && p.head.ref === branch);
            if (!pr) {
              core.info(`No open PR found for branch ${branch}; skipping PR comment.`);
              return;
            }

            // List existing comments on that PR
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: pr.number, per_page: 100
            });

            // Find existing marker comment (any author)
            const existing = comments.find(c => typeof c.body === 'string' && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body
              });
              core.info(`Updated IG publish URL comment on PR #${pr.number}`);
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number, body
              });
              core.info(`Created IG publish URL comment on PR #${pr.number}`);
            }

      - name: Warn when the PR comment could not be updated
        if: steps.preview_comment.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::The preview was deployed successfully, but the workflow could not update the PR comment. The deployment URL remains available in this job's summary."
